services:
  backend:
    image: ghcr.io/dennis-h1/cards-backend:latest
    container_name: karteikarten-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_PATH: /data/karteikarten.db
      MCP_API_KEY: ${MCP_API_KEY:?set MCP_API_KEY in .env}
    volumes:
      - ./data:/data
    networks:
      - internal

  web:
    image: ghcr.io/dennis-h1/cards-web:latest
    container_name: karteikarten-web
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST:?set VIRTUAL_HOST in .env}
      VIRTUAL_PORT: "80"
    depends_on:
      - backend
    networks:
      - nginx-proxy
      - internal

networks:
  nginx-proxy:
    external: true # TODO - internal infra decision for automatic routing
  internal:
    driver: bridge
