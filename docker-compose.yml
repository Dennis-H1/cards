services:
  karteikarten:
    build: .
    container_name: karteikarten
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_PATH: /data/karteikarten.db
      MCP_API_KEY: ${MCP_API_KEY:?set MCP_API_KEY in .env}
      VIRTUAL_HOST: karteikarten.example.com
      VIRTUAL_PORT: "8080"
    volumes:
      - ./data:/data
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true
